services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crispieri
      POSTGRES_USER: crispieri
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crispieri"]
      interval: 5s
      timeout: 5s
      retries: 5

  functions:
    build:
      context: .
      dockerfile: docker/functions.Dockerfile
    environment:
      SUPABASE_URL: http://postgres:8000  # or your actual Supabase/InsForge URL
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${PORT:-80}:80"
    environment:
      VITE_INSFORGE_URL: /api
    depends_on:
      - functions
    restart: unless-stopped

volumes:
  postgres_data:
